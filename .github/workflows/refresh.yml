# Grow the observation archive (kept in R2) and publish it for the swell-data Worker.
# Live data no longer depends on this: the Worker (workers/data) refreshes buoys, tides and
# forecasts on its own cron. This job only has to run often enough not to miss CWA's 48 h
# window, so a late or skipped GitHub schedule costs nothing.
name: Archive CWA observations

on:
  schedule:
    - cron: "20 */3 * * *" # every 3 h; CWA's live file covers 48 h
  workflow_dispatch:

concurrency:
  group: archive # never run two at once; they'd race on the archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }} # optional; without it fetch reads CWA's public S3 bucket
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Pull archive from R2
        run: scripts/archive-sync.sh pull
      - name: Fetch CWA data into the archive
        run: bun run fetch
      - name: Push archive to R2
        run: scripts/archive-sync.sh push
      - name: Publish CSVs for the site
        run: scripts/publish-archive.sh
